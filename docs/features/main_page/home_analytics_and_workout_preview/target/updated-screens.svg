<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="920" viewBox="0 0 1360 920">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#2c3128" flood-opacity=".16"/>
    </filter>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#151714}
      .muted{fill:#747a70}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:14px}
      .label{font-size:12px;font-weight:800}.h1{font-size:29px;font-weight:850;letter-spacing:-1.2px}
      .h2{font-size:24px;font-weight:850;letter-spacing:-.7px}.number{font-size:38px;font-weight:850}
      .card{fill:#fff;stroke:#dfe3d8}.pill{fill:#efffd0}.lime{fill:#b5ff00}
      .line{stroke:#e5e9df}.eyebrow{font-size:10px;font-weight:850;letter-spacing:1.2px;fill:#697064}
    </style>
  </defs>
  <rect width="1360" height="920" fill="#e7eae2"/>
  <circle cx="1180" cy="20" r="360" fill="#b5ff00" opacity=".16"/>
  <text x="55" y="48" class="eyebrow">FEATURE · HOME_ANALYTICS_AND_WORKOUT_PREVIEW</text>
  <text x="55" y="82" font-size="29" font-weight="850" letter-spacing="-1.2">Проверка контекста до начала тренировки</text>
  <text x="55" y="108" class="body muted">Обновлённая аналитика, выбор набора и подтверждение точного состава.</text>

  <!-- labels -->
  <text x="74" y="148" class="label">1. Обновлённая аналитика</text>
  <text x="510" y="148" class="label">2. Выбор без мгновенного старта</text>
  <text x="946" y="148" class="label">3. Проверка состава</text>

  <!-- phone 1 -->
  <g transform="translate(55 165)" filter="url(#shadow)">
    <rect width="390" height="700" rx="32" fill="#f5f7ef" stroke="#d2d6cd"/>
    <text x="22" y="25" class="tiny" font-weight="850">9:41</text><text x="310" y="25" class="tiny" font-weight="850">▮▮▮  ⌁  ▰</text>
    <text x="18" y="72" class="h1">Тренировки</text>
    <rect x="328" y="40" width="44" height="44" rx="14" class="card"/><text x="350" y="67" text-anchor="middle" font-weight="800">Е</text>
    <rect x="18" y="99" width="172" height="142" rx="20" class="card"/>
    <text x="33" y="142" class="number">12</text>
    <text x="33" y="169" class="small muted">Всего тренировок</text>
    <line x1="33" y1="193" x2="175" y2="193" class="line"/>
    <text x="33" y="220" class="small" font-weight="850">История</text><text x="169" y="221" font-size="26">›</text>
    <rect x="199" y="99" width="173" height="142" rx="20" class="card"/>
    <text x="214" y="142" font-size="38" font-weight="850" letter-spacing="-2">24 июля</text>
    <text x="214" y="169" class="small muted">Последняя</text><text x="214" y="187" class="small muted">тренировка</text>
    <rect x="18" y="251" width="354" height="111" rx="20" class="card"/>
    <text x="33" y="275" class="eyebrow">ТЕКУЩИЙ ЦИКЛ</text><text x="33" y="302" font-size="18" font-weight="800">Тренировка 5 из 12</text>
    <g transform="translate(33 318)">
      <rect width="20" height="7" rx="4" fill="#aaf000"/><rect x="26" width="20" height="7" rx="4" fill="#aaf000"/>
      <rect x="52" width="20" height="7" rx="4" fill="#aaf000"/><rect x="78" width="20" height="7" rx="4" fill="#aaf000"/>
      <circle cx="112" cy="3.5" r="7" fill="#fff" stroke="#92df00" stroke-width="3"/>
      <rect x="126" width="20" height="7" rx="4" fill="#e2e5df"/><rect x="152" width="20" height="7" rx="4" fill="#e2e5df"/>
      <rect x="178" width="20" height="7" rx="4" fill="#e2e5df"/><rect x="204" width="20" height="7" rx="4" fill="#e2e5df"/>
      <rect x="230" width="20" height="7" rx="4" fill="#e2e5df"/><rect x="256" width="20" height="7" rx="4" fill="#e2e5df"/>
      <rect x="282" width="20" height="7" rx="4" fill="#e2e5df"/>
    </g>
    <text x="33" y="350" class="tiny muted">Верх тела · силовая</text>
    <rect x="18" y="372" width="354" height="162" rx="20" class="card"/>
    <text x="33" y="399" class="small" font-weight="750">Прогресс с прошлой тренировки</text>
    <g class="tiny"><text x="33" y="432">↟　Выходы силой: с резиной</text><text x="287" y="432" class="muted">5×2 → 5×3</text>
    <line x1="33" y1="446" x2="356" y2="446" class="line"/><text x="33" y="472">↯　Стойка на руках: у стены</text><text x="280" y="472" class="muted">22 → 30 сек</text>
    <line x1="33" y1="486" x2="356" y2="486" class="line"/><text x="33" y="512">⌜　Планш: tuck planche</text><text x="286" y="512" class="muted">8 → 10 сек</text></g>
    <line x1="0" y1="620" x2="390" y2="620" stroke="#dfe3d8"/>
    <rect x="18" y="633" width="354" height="52" rx="16" class="lime"/><text x="195" y="665" text-anchor="middle" font-weight="850">Начать тренировку</text>
  </g>

  <!-- phone 2 -->
  <g transform="translate(491 165)" filter="url(#shadow)">
    <rect width="390" height="700" rx="32" fill="#f5f7ef" stroke="#d2d6cd"/>
    <text x="22" y="25" class="tiny" font-weight="850">9:41</text><text x="310" y="25" class="tiny" font-weight="850">▮▮▮  ⌁  ▰</text>
    <text x="18" y="72" class="h1">Тренировки</text>
    <rect x="18" y="99" width="172" height="142" rx="20" class="card"/><text x="33" y="142" class="number">12</text><text x="33" y="169" class="small muted">Всего тренировок</text>
    <rect x="199" y="99" width="173" height="142" rx="20" class="card"/><text x="214" y="142" font-size="38" font-weight="850" letter-spacing="-2">24 июля</text><text x="214" y="171" class="small muted">Последняя тренировка</text>
    <rect width="390" height="700" rx="32" fill="#151714" opacity=".42"/>
    <path d="M0 222 Q0 194 28 194 H362 Q390 194 390 222 V700 H0Z" fill="#f5f7ef"/>
    <rect x="174" y="205" width="42" height="4" rx="2" fill="#c7ccc1"/>
    <text x="18" y="258" class="h2">Выбери тренировку</text>
    <text x="18" y="282" class="small muted">Выбери набор, чтобы проверить состав.</text>
    <rect x="328" y="223" width="44" height="44" rx="14" class="card"/><text x="350" y="251" text-anchor="middle" font-size="21">×</text>
    <g transform="translate(18 301)">
      <rect width="354" height="88" rx="18" class="card"/><rect x="10" y="17" width="54" height="54" rx="14" fill="#f3f6ed"/><text x="37" y="51" text-anchor="middle" font-size="22">↟</text>
      <text x="78" y="31" font-size="16" font-weight="800">Push day</text><text x="78" y="51" class="tiny muted">3 упражнения · 35 мин</text><rect x="78" y="60" width="62" height="17" rx="9" class="pill"/><text x="109" y="72" text-anchor="middle" font-size="8" font-weight="850">СРЕДНЯЯ</text><text x="330" y="55" font-size="31">›</text>
      <rect y="97" width="354" height="88" rx="18" class="card"/><rect x="10" y="114" width="54" height="54" rx="14" fill="#f3f6ed"/><text x="37" y="148" text-anchor="middle" font-size="22">↓</text>
      <text x="78" y="128" font-size="16" font-weight="800">Pull &amp; core</text><text x="78" y="148" class="tiny muted">4 упражнения · 45 мин</text><rect x="78" y="157" width="62" height="17" rx="9" class="pill"/><text x="109" y="169" text-anchor="middle" font-size="8" font-weight="850">ВЫСОКАЯ</text><text x="330" y="152" font-size="31">›</text>
      <rect y="194" width="354" height="88" rx="18" class="card"/><rect x="10" y="211" width="54" height="54" rx="14" fill="#f3f6ed"/><text x="37" y="245" text-anchor="middle" font-size="22">○</text>
      <text x="78" y="225" font-size="16" font-weight="800">Лёгкая мобильность</text><text x="78" y="245" class="tiny muted">5 упражнений · 20 мин</text><rect x="78" y="254" width="52" height="17" rx="9" class="pill"/><text x="104" y="266" text-anchor="middle" font-size="8" font-weight="850">ЛЁГКАЯ</text><text x="330" y="249" font-size="31">›</text>
    </g>
    <rect x="18" y="606" width="354" height="48" rx="14" class="card"/><text x="195" y="636" text-anchor="middle" font-weight="800">Управлять тренировками</text>
  </g>

  <!-- phone 3 -->
  <g transform="translate(927 165)" filter="url(#shadow)">
    <rect width="390" height="700" rx="32" fill="#f5f7ef" stroke="#d2d6cd"/>
    <text x="22" y="25" class="tiny" font-weight="850">9:41</text><text x="310" y="25" class="tiny" font-weight="850">▮▮▮  ⌁  ▰</text>
    <rect x="18" y="40" width="44" height="44" rx="14" class="card"/><text x="40" y="69" text-anchor="middle" font-size="27">‹</text>
    <text x="195" y="67" text-anchor="middle" font-size="15" font-weight="800">Состав тренировки</text>
    <text x="18" y="112" class="eyebrow">ПЕРЕД НАЧАЛОМ</text><text x="18" y="151" font-size="34" font-weight="850" letter-spacing="-1.5">Push day</text>
    <g transform="translate(18 166)"><rect width="68" height="28" rx="10" class="card"/><text x="34" y="18" text-anchor="middle" class="tiny">Средняя</text>
      <rect x="76" width="96" height="28" rx="10" class="card"/><text x="124" y="18" text-anchor="middle" class="tiny">3 упражнения</text>
      <rect x="180" width="58" height="28" rx="10" class="card"/><text x="209" y="18" text-anchor="middle" class="tiny">35 мин</text></g>
    <g transform="translate(18 214)">
      <rect width="354" height="76" rx="15" class="card"/><rect x="10" y="24" width="28" height="28" rx="9" fill="#edf0e8"/><text x="24" y="43" text-anchor="middle" class="tiny" font-weight="900">1</text><text x="52" y="46" font-size="20">↟</text><text x="86" y="32" class="small" font-weight="800">Выходы силой</text><text x="86" y="52" class="tiny muted">5 × 3 повт. · с резиной</text>
      <rect y="85" width="354" height="76" rx="15" class="card"/><rect x="10" y="109" width="28" height="28" rx="9" fill="#edf0e8"/><text x="24" y="128" text-anchor="middle" class="tiny" font-weight="900">2</text><text x="52" y="131" font-size="20">║</text><text x="86" y="117" class="small" font-weight="800">Отжимания на брусьях</text><text x="86" y="137" class="tiny muted">4 × 8 повт. · собственный вес</text>
      <rect y="170" width="354" height="76" rx="15" class="card"/><rect x="10" y="194" width="28" height="28" rx="9" fill="#edf0e8"/><text x="24" y="213" text-anchor="middle" class="tiny" font-weight="900">3</text><text x="52" y="216" font-size="20">⌜</text><text x="86" y="202" class="small" font-weight="800">Планш</text><text x="86" y="222" class="tiny muted">4 × 10 сек · tuck planche</text>
    </g>
    <rect x="18" y="480" width="354" height="54" rx="8" fill="#fff"/><rect x="18" y="480" width="3" height="54" fill="#b5ff00"/><text x="31" y="502" class="tiny muted">Назад — изменить выбор.</text><text x="31" y="520" class="tiny muted">Старт — создать сессию и перейти к подходу 1.</text>
    <line x1="0" y1="620" x2="390" y2="620" stroke="#dfe3d8"/>
    <rect x="18" y="633" width="354" height="52" rx="16" class="lime"/><text x="195" y="665" text-anchor="middle" font-weight="850">Начать тренировку</text>
